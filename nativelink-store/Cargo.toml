lints.workspace = true

[package]
edition = "2024"
name = "nativelink-store"
version = "0.7.0"

[features]
default = []
# S3-compatible object storage (AWS S3 + NetApp ONTAP S3).
s3 = [
  "dep:aws-config",
  "dep:aws-sdk-s3",
  "dep:aws-smithy-runtime-api",
  "dep:aws-smithy-types",
  "dep:hyper-rustls",
]
# Google Cloud Storage.
gcs = ["dep:google-cloud-auth", "dep:google-cloud-storage"]
# Redis-backed store.
redis = ["dep:fred", "nativelink-error/redis"]
# MongoDB-backed store.
mongo = ["dep:mongodb"]
# Convenience: every remote backend, for upstream-parity builds and the
# full unit-test suite (`just test-standalone`).
all-backends = ["s3", "gcs", "redis", "mongo"]

[dependencies]
nativelink-config = { path = "../nativelink-config" }
nativelink-error = { path = "../nativelink-error" }
nativelink-metric = { path = "../nativelink-metric" }
nativelink-proto = { path = "../nativelink-proto" }
nativelink-util = { path = "../nativelink-util" }

async-lock = { version = "3.4.0", features = ["std"], default-features = false }
async-trait = "0.1.88"
aws-config = { version = "1.6.1", default-features = false, features = [
  "sso",
], optional = true }
aws-sdk-s3 = { version = "1.82.0", features = [
  "http-1x",
  "rt-tokio",
], default-features = false, optional = true }
aws-smithy-runtime-api = { version = "1.7.4", default-features = false, features = [
  "client",
  "http-1x",
], optional = true }
aws-smithy-types = { version = "1.3.0", default-features = false, features = [
  "http-body-1-x",
], optional = true }
base64 = { version = "0.22.1", default-features = false, features = ["std"] }
bincode = { version = "2.0.1", default-features = false, features = [
  "alloc",
  "serde",
] }
blake3 = { version = "1.8.0", default-features = false }
byteorder = { version = "1.5.0", default-features = false }
bytes = { version = "1.10.1", default-features = false }
bytes-utils = { version = "0.1.4", default-features = false }
const_format = { version = "0.2.34", default-features = false }
fred = { version = "10.1.0", default-features = false, features = [
  "blocking-encoding",
  "custom-reconnect-errors",
  "enable-rustls-ring",
  "i-redisearch",
  "i-scripts",
  "i-std",
  "mocks",
  "sentinel-auth",
  "sentinel-client",
  "sha-1",
  "subscriber-client",
], optional = true }
futures = { version = "0.3.31", default-features = false }
google-cloud-auth = { version = "0.17.2", default-features = false, optional = true }
google-cloud-storage = { version = "0.24.0", default-features = false, features = [
  "auth",
  "rustls-tls",
], optional = true }
hex = { version = "0.4.3", default-features = false }
http = { version = "1.3.1", default-features = false }
http-body = "1.0.1"
http-body-util = "0.1.3"
hyper = { version = "1.6.0" }
hyper-rustls = { version = "0.27.5", default-features = false, features = [
  "http1",
  "http2",
  "ring",
  "rustls-native-certs",
  "rustls-platform-verifier",
], optional = true }
hyper-util = { version = "0.1.11", default-features = false }
lz4_flex = { version = "0.11.3", default-features = false }
mongodb = { version = "3", features = [
  "compat-3-0-0",
  "rustls-tls",
], default-features = false, optional = true }
opentelemetry = { version = "0.29.1", default-features = false }
parking_lot = "0.12.3"
patricia_tree = { version = "0.9.0", default-features = false }
prost = { version = "0.13.5", default-features = false }
rand = { version = "0.9.0", default-features = false, features = [
  "thread_rng",
] }
regex = { version = "1.11.1", default-features = false }
rustls = { version = "0.23.27", default-features = false, features = [] }
# `std` is needed for `rustls_pemfile::certs`. It used to be enabled only via
# feature unification with the top-level crate's own (unused) dependency.
rustls-pemfile = { version = "2.1.2", default-features = false, features = [
  "std",
] }
serde = { version = "1.0.219", default-features = false }
serde_json = "1.0.140"
sha2 = { version = "0.10.8", default-features = false }
tokio = { version = "1.44.1", features = [
  "fs",
  "io-util",
  "net",
  "rt-multi-thread",
  "signal",
], default-features = false }
tokio-stream = { version = "0.1.17", features = [
  "fs",
], default-features = false }
tokio-util = { version = "0.7.14" }
tonic = { version = "0.13.0", features = [
  "tls-ring",
  "transport",
], default-features = false }
tracing = { version = "0.1.41", default-features = false }
uuid = { version = "1.16.0", default-features = false, features = [
  "serde",
  "v4",
] }

[dependencies.nix-compat]
workspace = true

[dependencies.nix-remote]
workspace = true

# Backend-specific integration tests. Each is skipped unless its backend
# feature is enabled (e.g. `cargo test --features all-backends`), so the
# default `cargo test` — and the aws-* dev-dependencies it would otherwise
# force — stay out of the lean build.
[[test]]
name = "s3_store_test"
required-features = ["s3"]

[[test]]
name = "ontap_s3_store_test"
required-features = ["s3"]

[[test]]
name = "ontap_s3_existence_cache_store_test"
required-features = ["s3"]

[[test]]
name = "gcs_store_test"
required-features = ["gcs"]

[[test]]
name = "gcs_client_test"
required-features = ["gcs"]

[[test]]
name = "redis_store_test"
required-features = ["redis"]

[[test]]
name = "mongo_store_test"
required-features = ["mongo"]

[dev-dependencies]
nativelink-macro = { path = "../nativelink-macro" }

aws-sdk-s3 = { version = "1.82.0", features = [
  "http-1x",
  "rt-tokio",
], default-features = false }
aws-smithy-runtime = { version = "1.8.1", default-features = false, features = [
  "client",
  "test-util",
] }
aws-smithy-runtime-api = { version = "1.7.4", default-features = false }
aws-smithy-types = { version = "1.3.0", default-features = false, features = [
  "http-body-1-x",
] }
http = { version = "1.3.1", default-features = false }
memory-stats = "1.2.0"
mock_instant = "0.5.3"
pretty_assertions = { version = "1.4.1", features = ["std"] }
rand = { version = "0.9.0", default-features = false, features = [
  "small_rng",
  "thread_rng",
] }
serde_json = "1.0.140"
tempfile = { version = "3.8.1", default-features = false }
tracing-subscriber = { version = "0.3.19", default-features = false }
tracing-test = { version = "0.2.5", default-features = false, features = [
  "no-env-filter",
] }
