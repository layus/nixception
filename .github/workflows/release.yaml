---
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Free disk space
        uses: endersonmenezes/free-disk-space@3f9ec39ebae520864ac93467ee395f5237585c21 # v2
        with:
          remove_android: false
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: false

      - name: Install Nix
        uses: cachix/install-nix-action@02a151ada4993995686f9ed4f1be7cfbb229e56f # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Set up Cachix
        uses: cachix/cachix-action@0fc020193b5a1fa3ac4575aa3a7d3aa6a35435ad # v16
        with:
          name: nixception
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        continue-on-error: true

      - name: Build static binaries
        run: nix build -L .#

      - name: Package artifacts
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp result/bin/nixception "dist/nixception-${version}-x86_64-linux-musl"
          cp result/bin/nativelink "dist/nativelink-${version}-x86_64-linux-musl"
          (cd dist && sha256sum ./* > "SHA256SUMS")

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "nixception $GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
