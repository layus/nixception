---
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  nix-build:
    name: Nix build / ubuntu-24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Free disk space
        uses: endersonmenezes/free-disk-space@3f9ec39ebae520864ac93467ee395f5237585c21 # v2
        with:
          remove_android: false
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: false

      - name: Install Nix
        uses: cachix/install-nix-action@02a151ada4993995686f9ed4f1be7cfbb229e56f # v31
        with:
          # inputs.self.submodules in flake.nix needs a recent Nix.
          install_url: https://releases.nixos.org/nix/nix-2.35.1/install
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Set up Cachix
        uses: cachix/cachix-action@0fc020193b5a1fa3ac4575aa3a7d3aa6a35435ad # v16
        with:
          name: nixception
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        # Pull-only for forks / missing token; pushes happen when the
        # CACHIX_AUTH_TOKEN secret is configured.
        continue-on-error: true

      - name: Build nixception
        run: nix build -L .#

      - name: Smoke-test binaries
        run: |
          test -x result/bin/nixception
          ./result/bin/nativelink --version
